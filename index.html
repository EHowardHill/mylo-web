    /* ================================================================
       CLICKABLE NOTIFICATIONS — drop-in replacement
       ================================================================
       Replace your existing `const Notifications = ...` component with
       the version below. No other components need to change unless you
       want channel deep-linking (see PATCH 2 at the bottom).
    
       Routing priority:
         1. Post target  -> opens the post in a modal (uses getPublicPost)
         2. Circle/DM target -> ui.goDM(circleId) or ui.goCircle(circleId)
         3. Source user  -> profile (covers "X followed you")
         4. Explicit link -> navigates
         5. Nothing found -> toast
    
       IMPORTANT: the three `pick(...)` lines probe common API field
       names. Open DevTools -> Network -> /notifications, look at one
       notification object, and adjust the candidate lists to match
       whatever your backend actually sends.
       ================================================================ */

    const Notifications = ({ onProfileClick }) => {
      const ui = useUI();
      const toast = useToast();
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const markReadCalled = useRef(false);

      useEffect(() => {
        (async () => {
          try {
            const res = await api.getNotifications();
            setItems(res || []);
            if (!markReadCalled.current && res && res.length > 0) {
              markReadCalled.current = true;
              setTimeout(() => {
                api.markNotificationsRead().then(() => ui.refreshBadges()).catch(() => { });
              }, 1500);
            }
          } catch (e) { toast.error(e.message); }
          setLoading(false);
        })();
      }, [toast]);

      // Probe a notification object for the first present field.
      // Checks top level, then a nested `data`/`meta` payload if present.
      const pick = (n, keys) => {
        for (const k of keys) {
          if (n[k] !== undefined && n[k] !== null) return n[k];
          if (n.data && n.data[k] !== undefined && n.data[k] !== null) return n.data[k];
          if (n.meta && n.meta[k] !== undefined && n.meta[k] !== null) return n.meta[k];
        }
        return null;
      };

      const openPostModal = async (postId) => {
        try {
          const res = await api.getPublicPost(postId);
          ui.openModal({
            title: 'post',
            wide: true,
            render: (close) => (
              <Post
                post={res.post}
                onProfileClick={(h) => { close(); onProfileClick(h); }}
                onUpdate={(np) => { setItems(prev => prev.map(x => x.id === np.id ? np : x)); }}
                onDeleted={(id) => { setItems(prev => prev.filter(x => x.id !== id)); }}
              />
            ),
          });
          return true;
        } catch (e) {
          return false; // post deleted or endpoint mismatch — fall through
        }
      };

      const openNotification = async (n) => {
        // Visually mark this one as read immediately
        setItems(prev => prev.map(x => x.id === n.id ? { ...x, is_read: true } : x));

        const targetType = n.target_type;
        const targetId = n.target_id;

        // ---- 1. Post notifications (mentions, +1s, comments, reshares) ----
        if (targetType === 'post' && targetId) {
          if (await openPostModal(targetId)) return;
          toast.show('This post is no longer available.');
          return;
        }

        // ---- 2. Channel / chat notifications (messages, replies, mentions) ----
        if (targetType === 'channel' && targetId) {
          if (n.circle_id) {
            ui.goCircle(n.circle_id, targetId);
            return;
          }
          // No circle resolved — fall through to source user.
        }

        // ---- 3. Follow notifications: the source IS the follower's profile ----
        if (targetType === 'profile' && targetId && n.source_user && n.source_user.handle) {
          onProfileClick(n.source_user.handle);
          return;
        }

        // ---- 4. Explicit link from the backend ----
        const link = pick(n, ['link', 'url', 'href']);
        if (link) {
          if (/^https?:\/\//.test(link)) window.open(link, '_blank', 'noopener');
          else window.location.href = link;
          return;
        }

        // ---- 5. Last resort: source user profile ----
        if (n.source_user && n.source_user.handle) {
          onProfileClick(n.source_user.handle);
          return;
        }

        toast.show('Nothing to open for this notification.');
      };

      if (loading) return <Spinner />;
      return (
        <div className="feed-container metro-stagger">
          {items.length === 0 ? <div className="card empty-state">No notifications.</div> :
            items.map(n => (
              <div
                key={n.id}
                className="card"
                role="button"
                tabIndex={0}
                onClick={() => openNotification(n)}
                onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openNotification(n); } }}
                style={{
                  padding: 16, display: 'flex', gap: 12, alignItems: 'center',
                  opacity: n.is_read ? 0.7 : 1, cursor: 'pointer',
                }}
              >
                {(n.icon_url || (n.source_user && n.source_user.photo_url)) && (
                  <img
                    src={n.icon_url || n.source_user.photo_url}
                    className="avatar"
                    style={{ width: 40, height: 40 }}
                    alt=""
                  />
                )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 500 }}>{n.title}</div>
                  <div style={{ color: 'var(--gplus-text-secondary)', fontSize: 14 }}>{n.body}</div>
                  {n.image_url && (
                    <img
                      src={n.image_url}
                      alt=""
                      style={{ marginTop: 8, maxWidth: 200, borderRadius: 0, cursor: 'pointer' }}
                      onClick={(e) => { e.stopPropagation(); ui.openLightbox(n.image_url); }}
                    />
                  )}
                  <div style={{ fontSize: 12, color: 'var(--gplus-text-secondary)', marginTop: 4 }}>{timeAgo(n.created_at)}</div>
                </div>
                {!n.is_read && (
                  <span style={{ width: 10, height: 10, background: 'var(--gplus-red)', flexShrink: 0 }} />
                )}
              </div>
            ))}
        </div>
      );
    };


    /* ================================================================
       PATCH 2 (OPTIONAL): deep-link to a specific channel in a circle
       ================================================================
       Without this, message notifications land on the circle's first
       channel. With it, ui.goCircle(circleId, channelId) opens the
       exact channel. Three small edits:
    
       --- (a) In App(), extend the ui memo's goCircle and add state: ---
    
         const [pendingChannel, setPendingChannel] = useState(null);
    
         // inside useMemo(() => ({ ... }))
         goCircle: (circleId, channelId) => {
           setActiveCircle(circleId);
           setPendingChannel(channelId || null);
           setPage('circle');
           setSidebarOpen(false);
         },
    
       --- (b) Pass it into CircleView where it's rendered: ---
    
         <CircleView
           circleId={activeCircle}
           initialChannelId={pendingChannel}
           ...existing props
         />
    
       --- (c) In CircleView, accept the prop and prefer it in load(): ---
    
         const CircleView = ({ circleId, initialChannelId, onBack, ... }) => {
           ...
           // inside load(), replace the setActiveCh(...) line with:
           setActiveCh(prev => {
             const wanted = initialChannelId && chs.find(x => x.id === initialChannelId);
             if (wanted) return wanted;
             return prev && chs.find(x => x.id === prev.id) ? prev : chs[0] || null;
           });
    
       Then uncomment the channel_id line in openNotification above.
       ================================================================ */

    const Message = ({ msg, canModerate, onProfileClick, onReply, onChanged, onDeleted }) => {
      const auth = useAuth();
      const ui = useUI();
      const toast = useToast();
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(msg.content);
      const [showEmoji, setShowEmoji] = useState(false);
      const isAuthor = msg.author && msg.author.id === (auth.user && auth.user.id);

      if (msg.is_system) return <div className="msg-system">{msg.content}</div>;

      const react = async (emoji) => {
        try { const res = await api.reactMessage(msg.id, emoji); onChanged({ ...msg, reactions: res.reactions }); setShowEmoji(false); }
        catch (e) { toast.error(e.message); }
      };
      const pin = async () => {
        try { const res = await api.pinMessage(msg.id); onChanged({ ...msg, pinned: res.pinned }); toast.show(res.pinned ? 'Pinned.' : 'Unpinned.'); }
        catch (e) { toast.error(e.message); }
      };
      const saveEdit = async () => {
        try { await api.editMessage(msg.id, draft); onChanged({ ...msg, content: draft, content_html: formatText(draft), edited: true }); setEditing(false); }
        catch (e) { toast.error(e.message); }
      };
      const del = () => ui.openModal({
        render: (close) => (
          <ConfirmDialog title="Delete message?" message="This can't be undone." confirmLabel="Delete" danger
            onConfirm={async () => { await api.deleteMessage(msg.id); onDeleted(msg.id); }} onClose={close} />
        )
      });

      return (
        <div className="msg">
          <Avatar user={msg.author} size={36} className="msg-avatar" onClick={() => msg.author && onProfileClick(msg.author.handle)} />
          <div className="msg-body">
            {msg.reply_to && <div className="msg-reply-ref">↩ {msg.reply_to.author_name}: {(msg.reply_to.content || '').slice(0, 80)}</div>}
            <div className="msg-meta">
              <span className="msg-author" onClick={() => msg.author && onProfileClick(msg.author.handle)}>{msg.author ? msg.author.name : 'Unknown'}</span>
              <span className="msg-time">{clockTime(msg.created_at)}{msg.edited ? ' · edited' : ''}</span>
              {msg.pinned && <span className="pinned-flag">📌 pinned</span>}
            </div>
            {editing ? (
              <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                <MentionInput className="form-input" value={draft} onChange={setDraft} onSubmit={saveEdit} autoFocus />
                <button className="btn btn-sm" onClick={saveEdit}>Save</button>
                <button className="btn btn-sm btn-outline" onClick={() => { setEditing(false); setDraft(msg.content); }}>Cancel</button>
              </div>
            ) : (
              <div className="msg-text">
                <RichText text={msg.content} html={msg.content_html} onMention={onProfileClick} />
              </div>
            )}
            {msg.image_url && <img className="msg-attach-img" src={msg.image_url} alt="attachment" onClick={() => ui.openLightbox(msg.image_url)} />}
            {msg.is_video && msg.file_url && !msg.image_url && (
              <div className="msg-media-embed">
                <video src={msg.file_url} controls preload="metadata" style={{ width: '100%', maxHeight: 320, borderRadius: 0 }} />
              </div>
            )}
            {msg.is_audio && msg.file_url && !msg.image_url && (
              <div className="msg-media-embed">
                <audio src={msg.file_url} controls preload="metadata" style={{ width: '100%' }} />
              </div>
            )}
            {msg.file_url && !msg.image_url && !msg.is_video && !msg.is_audio && (
              <a className="msg-file" href={msg.file_url} target="_blank" rel="noopener noreferrer">
                <I.Attach /> {msg.file_name || 'Attachment'} {msg.file_size ? `· ${(msg.file_size / 1024 / 1024).toFixed(1)}MB` : ''}
              </a>
            )}
            {msg.reactions && msg.reactions.length > 0 && (
              <div className="reactions">
                {msg.reactions.map(r => (
                  <span key={r.emoji} className={`reaction-chip ${r.me ? 'me' : ''}`} onClick={() => react(r.emoji)}>{r.emoji} {r.count}</span>
                ))}
              </div>
            )}
          </div>
          <div className="msg-tools">
            <button className="icon-btn" title="React" onClick={() => setShowEmoji(s => !s)}><I.Emoji /></button>
            <button className="icon-btn" title="Reply" onClick={() => onReply(msg)}><I.Reply /></button>
            <button className="icon-btn" title="Pin" onClick={pin}><I.Pin /></button>
            {isAuthor && <button className="icon-btn" title="Edit" onClick={() => setEditing(true)}><I.Edit /></button>}
            {(isAuthor || canModerate) && <button className="icon-btn" title="Delete" onClick={del}><I.Trash /></button>}
          </div>
          {showEmoji && (
            <div className="card dropdown-menu metro-anim" style={{ position: 'absolute', right: 8, top: 24, zIndex: 30, padding: 8, margin: 0 }} onMouseLeave={() => setShowEmoji(false)}>
              <EmojiPicker onPick={react} />
            </div>
          )}
        </div>
      );
    };

    const ChatView = ({ channelId, channelName, channelDesc, canModerate, canPost = true, onProfileClick, headerExtra }) => {
      const auth = useAuth();
      const toast = useToast();
      const ui = useUI();
      const [messages, setMessages] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadingMore, setLoadingMore] = useState(false);
      const [hasMore, setHasMore] = useState(true);
      const [text, setText] = useState('');
      const [file, setFile] = useState(null);
      const [replyTo, setReplyTo] = useState(null);
      const [sending, setSending] = useState(false);
      const sendingRef = useRef(false);
      const [alertOn, setAlertOn] = useState(false);
      const [showPinned, setShowPinned] = useState(false);
      const [pinnedMessages, setPinnedMessages] = useState([]);
      const [gifOpen, setGifOpen] = useState(false);
      const scrollRef = useRef(null);
      const fileRef = useRef(null);
      const [typingUsers, setTypingUsers] = useState([]);
      const atBottomRef = useRef(true);
      const myIdRef = useRef(null);
      const typingTimersRef = useRef({});
      const lastTypingSentRef = useRef(0);

      const load = useCallback(async () => {
        setLoading(true);
        try {
          const res = await api.getMessages(channelId, { limit: 50 });
          setMessages(res || []);
          setHasMore((res || []).length >= 50);
          await api.markChannelRead(channelId).catch(() => { });
          ui.refreshBadges();
        } catch (e) { toast.error(e.message); }
        setLoading(false);
      }, [channelId, toast, ui]);

      useEffect(() => {
        load();
        api.getChannelAlert(channelId).then(r => setAlertOn(!!r.enabled)).catch(() => { });
      }, [load, channelId]);

      // Keep my own user id in a ref so the SSE handlers (which close over it)
      // don't need `auth.user` as a dependency — the stream stays open across
      // a refreshUser() call rather than tearing down on every user-state change.
      useEffect(() => { myIdRef.current = auth.user ? auth.user.id : null; }, [auth.user]);

      // Track whether the scroll container is pinned to the bottom, so incoming
      // real-time messages only auto-scroll when the user is already reading the
      // latest (Discord-style). A user scrolled up reading history stays put.
      useEffect(() => {
        const el = scrollRef.current;
        if (!el) return;
        const onScroll = () => {
          atBottomRef.current = (el.scrollHeight - el.scrollTop - el.clientHeight) < 80;
        };
        el.addEventListener('scroll', onScroll, { passive: true });
        return () => el.removeEventListener('scroll', onScroll);
      }, []);

      useEffect(() => {
        if (!loading && scrollRef.current && !loadingMore && atBottomRef.current)
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
      }, [messages, loading, loadingMore]);

      // Real-time: Server-Sent Events subscription for this channel.
      // Reconnects automatically (EventSource) and re-subscribes on channel switch.
      useEffect(() => {
        const es = new EventSource(api.channelStreamUrl(channelId), { withCredentials: true });
        const clearTypingTimer = (uid) => {
          if (typingTimersRef.current[uid]) {
            clearTimeout(typingTimersRef.current[uid]);
            delete typingTimersRef.current[uid];
          }
        };
        const onMessage = (e) => {
          try {
            const m = JSON.parse(e.data);
            setMessages(prev => (prev.some(x => x.id === m.id) ? prev : [...prev, m]));
          } catch { }
        };
        const onEdit = (e) => {
          try {
            const d = JSON.parse(e.data);
            setMessages(prev => prev.map(x => x.id === d.id ? { ...x, ...d } : x));
          } catch { }
        };
        const onDelete = (e) => {
          try {
            const d = JSON.parse(e.data);
            setMessages(prev => prev.filter(x => x.id !== d.id));
          } catch { }
        };
        const onReaction = (e) => {
          try {
            const d = JSON.parse(e.data);
            setMessages(prev => prev.map(x => x.id === d.message_id ? { ...x, reactions: d.reactions } : x));
          } catch { }
        };
        const onPin = (e) => {
          try {
            const d = JSON.parse(e.data);
            setMessages(prev => prev.map(x => x.id === d.message_id ? { ...x, pinned: d.pinned } : x));
          } catch { }
        };
        const onTyping = (e) => {
          try {
            const d = JSON.parse(e.data);
            const u = d.user;
            if (!u || u.id === myIdRef.current) return;   // never show my own typing
            if (d.state === 'stop') {
              setTypingUsers(prev => prev.filter(x => x.id !== u.id));
              clearTypingTimer(u.id);
            } else {
              setTypingUsers(prev => prev.some(x => x.id === u.id) ? prev : [...prev, u]);
              clearTypingTimer(u.id);
              typingTimersRef.current[u.id] = setTimeout(() => {
                setTypingUsers(prev => prev.filter(x => x.id !== u.id));
                delete typingTimersRef.current[u.id];
              }, 4500);
            }
          } catch { }
        };
        es.addEventListener('message', onMessage);
        es.addEventListener('message_edit', onEdit);
        es.addEventListener('message_delete', onDelete);
        es.addEventListener('reaction', onReaction);
        es.addEventListener('pin', onPin);
        es.addEventListener('typing', onTyping);
        // EventSource auto-reconnects on transient errors; nothing to do here.
        return () => {
          es.close();
          Object.values(typingTimersRef.current).forEach(t => clearTimeout(t));
          typingTimersRef.current = {};
          setTypingUsers([]);
        };
      }, [channelId]);


      const loadMore = async () => {
        if (!messages.length) return;
        setLoadingMore(true);
        const prevH = scrollRef.current.scrollHeight;
        try {
          const res = await api.getMessages(channelId, { limit: 50, before: messages[0].id });
          if (!res || res.length === 0) setHasMore(false);
          else {
            setMessages(prev => [...res, ...prev]);
            if (res.length < 50) setHasMore(false);
            requestAnimationFrame(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight - prevH; });
          }
        } catch (e) { toast.error(e.message); }
        setLoadingMore(false);
      };

      const send = async () => {
        if (sendingRef.current) return;
        if (!text.trim() && !file) return;
        sendingRef.current = true;
        setSending(true);
        // Generate a per-attempt idempotency key so a retried/duplicated
        // request (e.g. user double-tapping send during lag) is deduped by
        // the server and returns the original message instead of creating a
        // duplicate.
        const idempotencyKey = (crypto.randomUUID && crypto.randomUUID())
          || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        atBottomRef.current = true;
        try {
          let body;
          if (file) {
            body = new FormData();
            body.append('content', text);
            body.append('file', file);
            if (replyTo) body.append('reply_to', replyTo.id);
          } else {
            body = { content: text, reply_to: replyTo ? replyTo.id : null };
          }
          const res = await api.sendMessage(channelId, body, idempotencyKey);
          // Optimistic append (deduped: the server also pushes this via SSE to us).
          setMessages(prev => prev.some(x => x.id === res.message.id) ? prev : [...prev, res.message]);
          setText(''); setFile(null); setReplyTo(null);
          if (fileRef.current) fileRef.current.value = '';
          api.sendTyping(channelId, 'stop').catch(() => { });
          lastTypingSentRef.current = 0;
          requestAnimationFrame(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; });
        } catch (e) { toast.error(e.message); }
        sendingRef.current = false;
        setSending(false);
      };

      // Typing input: drive the typing indicator by POSTing state changes,
      // debounced to ~once per 2s while actively typing (like Discord). Clearing
      // the field or sending immediately announces "stop".
      const handleTextChange = (val) => {
        setText(val);
        if (!canPost) return;
        const now = Date.now();
        if (val.trim() && now - lastTypingSentRef.current > 2000) {
          lastTypingSentRef.current = now;
          api.sendTyping(channelId, 'typing').catch(() => { });
        } else if (!val.trim() && lastTypingSentRef.current) {
          lastTypingSentRef.current = 0;
          api.sendTyping(channelId, 'stop').catch(() => { });
        }
      };

      const onChanged = (m) => setMessages(prev => prev.map(x => x.id === m.id ? m : x));
      const onDeleted = (id) => setMessages(prev => prev.filter(x => x.id !== id));
      const toggleAlert = async () => {
        try { await api.toggleChannelAlert(channelId); setAlertOn(a => !a); toast.show(alertOn ? 'Alerts off.' : 'Alerts on.'); }
        catch (e) { toast.error(e.message); }
      };
      const loadPinned = async () => {
        try {
          const res = await api.getMessages(channelId, { pinned: 'true', limit: 50 });
          setPinnedMessages(res || []);
          setShowPinned(true);
        } catch (e) { toast.error(e.message); }
      };

      return (
        <div className="chat-main page-transition">
          <div className="chat-header">
            {headerExtra}
            <div style={{ flex: 1 }}>
              <div className="title">#{channelName}</div>
              {channelDesc && <div className="desc">{channelDesc}</div>}
            </div>
            {showPinned ? <button className="btn btn-sm btn-outline" onClick={() => setShowPinned(false)}>Back to chat</button>
              : <button className="icon-btn" title="Pinned" onClick={loadPinned}><I.Pin /></button>}
            <button className="icon-btn" title={alertOn ? 'Alerts on' : 'Alerts off'} onClick={toggleAlert} style={{ color: alertOn ? 'var(--gplus-red)' : undefined }}><I.Bell /></button>
          </div>

          <div className="messages-scroll" ref={scrollRef}>
            {showPinned ? (
              <>
                <div className="folder-label">Pinned messages</div>
                {(pinnedMessages.length === 0) && <div className="empty-state">No pinned messages.</div>}
                {pinnedMessages.map(m => <Message key={m.id} msg={m} canModerate={canModerate} onProfileClick={onProfileClick} onReply={() => { }} onChanged={onChanged} onDeleted={onDeleted} />)}
              </>
            ) : loading ? <Spinner /> : (
              <>
                {hasMore && <button className="btn btn-outline btn-sm" style={{ alignSelf: 'center' }} onClick={loadMore} disabled={loadingMore}>{loadingMore ? 'Loading…' : 'Load earlier'}</button>}
                {messages.length === 0 && <div className="empty-state">No messages yet. Say hi 👋</div>}
                {messages.map(m => <Message key={m.id} msg={m} canModerate={canModerate} onProfileClick={onProfileClick} onReply={setReplyTo} onChanged={onChanged} onDeleted={onDeleted} />)}
              </>
            )}
          </div>

          {!showPinned && typingUsers.length > 0 && (
            <div className="typing-bar">
              <span className="typing-avatars">
                {typingUsers.slice(0, 3).map(u => (
                  <img key={u.id} src={u.photo_url || fallbackAvatar(u)} className="typing-avatar" alt=""
                    onError={(e) => { e.target.onerror = null; e.target.src = fallbackAvatar(u); }} />
                ))}
              </span>
              <span className="typing-text">
                {typingUsers.length === 1
                  ? `${typingUsers[0].name} is typing`
                  : typingUsers.length === 2
                    ? `${typingUsers[0].name} and ${typingUsers[1].name} are typing`
                    : `${typingUsers[0].name} and ${typingUsers.length - 1} others are typing`}
              </span>
              <span className="typing-dots"><span></span><span></span><span></span></span>
            </div>
          )}

          {!showPinned && (
            canPost ? (
            <div className="composer">
              {replyTo && <div className="composer-reply"><span>Replying to {replyTo.author ? replyTo.author.name : ''}</span><button className="icon-btn" onClick={() => setReplyTo(null)}><I.Close /></button></div>}
              {file && <div className="chip">{file.name}<button onClick={() => setFile(null)}>×</button></div>}
              <div className="composer-row">
                <input type="file" ref={fileRef} style={{ display: 'none' }} onChange={e => setFile(e.target.files[0])} />
                <button className="icon-btn" onClick={() => fileRef.current.click()}><I.Attach /></button>
                <button className="icon-btn" onClick={() => setGifOpen(true)}><I.Gif /></button>
                <MentionInput multiline className="composer-input" rows={1}
                  placeholder={`Message #${channelName}`} value={text}
                  onChange={handleTextChange} onSubmit={send} />
                <button className="btn" onClick={send} disabled={sending}><I.Send /></button>
              </div>
              {gifOpen && <GifPicker onClose={() => setGifOpen(false)} onPick={(url) => setText(t => (t ? t + ' ' : '') + url)} />}
            </div>
            ) : (
              <div className="composer" style={{ justifyContent: 'center', alignItems: 'center', color: 'var(--gplus-text-secondary)', fontStyle: 'italic', padding: '12px' }}>
                Only the circle owner can post in this channel.
              </div>
            )
          )}
        </div>
      );
    };

    const ChannelFeed = ({ channelId, channelName, canPost = true, onProfileClick }) => {
      const ui = useUI();
      const toast = useToast();
      const [posts, setPosts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showPinned, setShowPinned] = useState(false);
      const [pinnedPosts, setPinnedPosts] = useState([]);
      const load = useCallback(async () => {
        setLoading(true);
        try {
          const res = await api.getFeed({ channel_id: channelId, limit: 20 });
          setPosts(res.posts || []);
          ui.refreshBadges();
        }
        catch (e) { console.error(e); }
        setLoading(false);
      }, [channelId, ui]);
      useEffect(() => { load(); }, [load]);
      const loadPinned = async () => {
        try {
          const res = await api.getFeed({ channel_id: channelId, pinned: 'true', limit: 50 });
          setPinnedPosts(res.posts || []);
          setShowPinned(true);
        } catch (e) { toast.error(e.message); }
      };
      return (
        <div className="chat-main page-transition">
          <div className="chat-header">
            <div style={{ flex: 1 }}><div className="title">#{channelName}</div><div className="desc">Feed channel</div></div>
            {showPinned
              ? <button className="btn btn-sm btn-outline" onClick={() => setShowPinned(false)}>Back to feed</button>
              : <button className="icon-btn" title="Pinned" onClick={loadPinned}><I.Pin /></button>}
          </div>
          <div style={{ flex: 1, overflowY: 'auto' }}>
            <div className="feed-container metro-stagger">
              {showPinned ? (
                <>
                  <div className="folder-label">Pinned posts</div>
                  {pinnedPosts.length === 0 && <div className="card empty-state">No pinned posts.</div>}
                  {pinnedPosts.map(p => <Post key={p.id} post={p} onProfileClick={onProfileClick}
                    onUpdate={(np) => setPinnedPosts(prev => prev.map(x => x.id === np.id ? np : x))}
                    onDeleted={(id) => setPinnedPosts(prev => prev.filter(x => x.id !== id))} />)}
                </>
              ) : (
                <>
                  {canPost ? <InlineCompose onOpen={() => ui.openCompose({ defaultChannelId: channelId, onCreated: load })} />
                    : <div className="empty-state" style={{ fontStyle: 'italic' }}>Only the circle owner can post in this channel.</div>}
                  {loading ? <Spinner /> : posts.length === 0 ? <div className="empty-state">No posts in this channel yet.</div> :
                    posts.map(p => <Post key={p.id} post={p} onProfileClick={onProfileClick}
                      onUpdate={(np) => setPosts(prev => prev.map(x => x.id === np.id ? np : x))}
                      onDeleted={(id) => setPosts(prev => prev.filter(x => x.id !== id))} />)}
                </>
              )}
            </div>
          </div>
        </div>
      );
    };

    const CircleSettings = ({ circle, onClose, onChanged, onDeleted, onLeft }) => {
      const auth = useAuth();
      const ui = useUI();
      const toast = useToast();
      const [tab, setTab] = useState('general');
      const [name, setName] = useState(circle.name);
      const [isPublic, setIsPublic] = useState(circle.is_public);
      const [invite, setInvite] = useState(circle.invite_code);
      const [members, setMembers] = useState([]);
      const [layout, setLayout] = useState({ channels: [], folders: [] });
      const iconRef = useRef(null);
      const bannerRef = useRef(null);
      const isOwner = circle.is_owner;

      const reloadLayout = useCallback(() => api.getLayout(circle.id).then(setLayout).catch(() => { }), [circle.id]);
      useEffect(() => {
        api.getMembers(circle.id).then(setMembers).catch(() => { });
        reloadLayout();
      }, [circle.id, reloadLayout]);

      const saveGeneral = async () => {
        try { await api.updateCircle(circle.id, { name, is_public: isPublic }); toast.show('Saved.'); onChanged && onChanged({ ...circle, name, is_public: isPublic }); }
        catch (e) { toast.error(e.message); }
      };
      const uploadImg = async (e, kind) => {
        const f = e.target.files[0]; if (!f) return;
        const fd = new FormData(); fd.append('file', f);
        try {
          const res = kind === 'icon' ? await api.uploadCircleIcon(circle.id, fd) : await api.uploadCircleBanner(circle.id, fd);
          toast.show('Updated.'); if (kind === 'icon') onChanged && onChanged({ ...circle, icon_url: res.url });
        }
        catch (err) { toast.error(err.message); }
        e.target.value = '';
      };
      const resetInvite = async () => {
        try { const res = await api.resetInvite(circle.id); setInvite(res.invite_code); toast.show('New invite generated.'); }
        catch (e) { toast.error(e.message); }
      };
      const kick = async (uid) => {
        try { await api.kickMember(circle.id, uid); setMembers(m => m.filter(x => x.id !== uid)); toast.show('Removed.'); }
        catch (e) { toast.error(e.message); }
      };
      const transfer = (m) => ui.openModal({
        render: (close) => (
          <ConfirmDialog title="Transfer ownership?" message={`Make ${m.name} the new owner? You'll become a regular member.`} confirmLabel="Transfer"
            onConfirm={async () => { await api.transferOwnership(circle.id, m.id); toast.show('Ownership transferred.'); onChanged && onChanged({ ...circle, is_owner: false }); onClose(); }} onClose={close} />
        )
      });
      const del = () => ui.openModal({
        render: (close) => (
          <ConfirmDialog title="Delete circle?" message="This removes all channels and messages permanently." confirmLabel="Delete" danger
            onConfirm={async () => { await api.deleteCircle(circle.id); toast.show('Circle deleted.'); onDeleted(circle.id); onClose(); }} onClose={close} />
        )
      });
      const leave = () => ui.openModal({
        render: (close) => (
          <ConfirmDialog title="Leave circle?" message="You'll need an invite to rejoin if it's private." confirmLabel="Leave" danger
            onConfirm={async () => { await api.leaveCircle(circle.id); toast.show('Left circle.'); onLeft(circle.id); onClose(); }} onClose={close} />
        )
      });

      const addChannel = async () => {
        const cn = prompt('Channel name'); if (!cn) return;
        try { await api.createChannel(circle.id, { name: cn, channel_type: 'chat', folder_id: null }); reloadLayout(); }
        catch (e) { toast.error(e.message); }
      };
      const renameChannel = async (ch) => {
        const nn = prompt('New channel name', ch.name); if (!nn) return;
        try { await api.updateChannel(circle.id, ch.id, { name: nn }); reloadLayout(); } catch (e) { toast.error(e.message); }
      };
      const toggleOwnerOnly = async (ch) => {
        const next = !ch.owner_only_posts;
        try { await api.updateChannel(circle.id, ch.id, { owner_only_posts: next }); reloadLayout(); }
        catch (e) { toast.error(e.message); }
      };
      const delChannel = async (ch) => {
        try { await api.deleteChannel(circle.id, ch.id); reloadLayout(); } catch (e) { toast.error(e.message); }
      };
      const moveChannel = async (idx, dir) => {
        const chs = [...layout.channels];
        const j = idx + dir; if (j < 0 || j >= chs.length) return;
        [chs[idx], chs[j]] = [chs[j], chs[idx]];
        const payload = chs.map((c, i) => ({ id: c.id, position: i, folder_id: c.folder_id || null }));
        setLayout(l => ({ ...l, channels: chs }));
        try { await api.reorderChannels(circle.id, payload); } catch (e) { toast.error(e.message); reloadLayout(); }
      };
      const addFolder = async () => {
        const fn = prompt('Folder name'); if (!fn) return;
        try { await api.createFolder(circle.id, fn); reloadLayout(); } catch (e) { toast.error(e.message); }
      };
      const renameFolder = async (f) => {
        const nn = prompt('New folder name', f.name); if (!nn) return;
        try { await api.updateFolder(circle.id, f.id, { name: nn }); reloadLayout(); } catch (e) { toast.error(e.message); }
      };
      const delFolder = async (f) => {
        try { await api.deleteFolder(circle.id, f.id); reloadLayout(); } catch (e) { toast.error(e.message); }
      };
      const moveFolder = async (idx, dir) => {
        const fs = [...layout.folders];
        const j = idx + dir; if (j < 0 || j >= fs.length) return;
        [fs[idx], fs[j]] = [fs[j], fs[idx]];
        setLayout(l => ({ ...l, folders: fs }));
        try {
          await api.reorderFolders(circle.id, fs.map(f => f.id));
          const fresh = await api.getFolders(circle.id);
          if (Array.isArray(fresh)) setLayout(l => ({ ...l, folders: fresh }));
        } catch (e) { toast.error(e.message); reloadLayout(); }
      };

      return (
        <>
          <div className="card tabs tabs-compact">
            <div className={`tab ${tab === 'general' ? 'active' : ''}`} onClick={() => setTab('general')}>General</div>
            <div className={`tab ${tab === 'members' ? 'active' : ''}`} onClick={() => setTab('members')}>Members</div>
            {isOwner && <div className={`tab ${tab === 'channels' ? 'active' : ''}`} onClick={() => setTab('channels')}>Channels</div>}
            <div className={`tab ${tab === 'danger' ? 'active' : ''}`} onClick={() => setTab('danger')}>Danger zone</div>
          </div>

          {tab === 'general' && (
            <div className="metro-anim">
              <div className="form-group"><label>Name</label>
                <input className="form-input" value={name} disabled={!isOwner} onChange={e => setName(e.target.value)} /></div>
              {isOwner && (
                <div className="settings-row" style={{ padding: '8px 0' }}>
                  <span>Public (discoverable)</span>
                  <label className="toggle-switch"><input type="checkbox" checked={isPublic} onChange={e => setIsPublic(e.target.checked)} /><span className="slider"></span></label>
                </div>
              )}
              <div className="form-group"><label>Invite code</label>
                <div style={{ display: 'flex', gap: 8 }}>
                  <input className="form-input" readOnly value={invite || ''} onFocus={e => e.target.select()} />
                  {isOwner && <button className="btn btn-outline" onClick={resetInvite}>Reset</button>}
                </div>
              </div>
              {isOwner && (
                <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                  <input type="file" ref={iconRef} accept="image/*" style={{ display: 'none' }} onChange={e => uploadImg(e, 'icon')} />
                  <input type="file" ref={bannerRef} accept="image/*" style={{ display: 'none' }} onChange={e => uploadImg(e, 'banner')} />
                  <button className="btn btn-outline" onClick={() => iconRef.current.click()}>Upload icon</button>
                  <button className="btn btn-outline" onClick={() => bannerRef.current.click()}>Upload banner</button>
                </div>
              )}
              {isOwner && <button className="btn" onClick={saveGeneral}>Save changes</button>}
            </div>
          )}

          {tab === 'members' && (
            <div className="metro-stagger">
              {members.map(m => (
                <UserRow key={m.id} user={m} onProfileClick={(h) => { onClose(); ui.goProfile(h); }}
                  right={<div style={{ display: 'flex', gap: 6 }}>
                    {m.is_owner && <span className="chip">Owner</span>}
                    {isOwner && !m.is_owner && <button className="btn btn-sm btn-outline" onClick={() => transfer(m)}>Make owner</button>}
                    {isOwner && m.id !== (auth.user && auth.user.id) && !m.is_owner && <button className="btn btn-sm btn-danger" onClick={() => kick(m.id)}>Kick</button>}
                  </div>} />
              ))}
            </div>
          )}

          {tab === 'channels' && isOwner && (
            <div className="metro-stagger">
              <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                <button className="btn btn-outline btn-sm" onClick={addChannel}>+ Channel</button>
                <button className="btn btn-outline btn-sm" onClick={addFolder}>+ Folder</button>
              </div>
              {layout.folders.map((f, i) => (
                <div key={f.id} className="list-row">
                  <span style={{ flex: 1, fontWeight: 600 }}>📁 {f.name}</span>
                  <button className="icon-btn" onClick={() => moveFolder(i, -1)}>▲</button>
                  <button className="icon-btn" onClick={() => moveFolder(i, 1)}>▼</button>
                  <button className="link-btn" onClick={() => renameFolder(f)}>Rename</button>
                  <button className="link-btn" onClick={() => delFolder(f)} style={{ color: '#b00020' }}>Delete</button>
                </div>
              ))}
              {layout.channels.map((ch, i) => (
                <div key={ch.id} className="list-row">
                  <span style={{ flex: 1 }}>#{ch.name} <span className="user-handle">({ch.channel_type})</span>{ch.owner_only_posts && <span className="user-handle" title="Owner-only posting"> 🔒</span>}</span>
                  <label className="toggle-switch" title="Restrict posting to owner only" style={{ marginRight: 8 }}>
                    <input type="checkbox" checked={!!ch.owner_only_posts} onChange={() => toggleOwnerOnly(ch)} />
                    <span className="slider"></span>
                  </label>
                  <button className="icon-btn" onClick={() => moveChannel(i, -1)}>▲</button>
                  <button className="icon-btn" onClick={() => moveChannel(i, 1)}>▼</button>
                  <button className="link-btn" onClick={() => renameChannel(ch)}>Rename</button>
                  <button className="link-btn" onClick={() => delChannel(ch)} style={{ color: '#b00020' }}>Delete</button>
                </div>
              ))}
            </div>
          )}

          {tab === 'danger' && (
            <div className="metro-anim">
              {!isOwner && <button className="btn btn-danger" onClick={leave}>Leave circle</button>}
              {isOwner && <>
                <p style={{ marginBottom: 12, color: 'var(--gplus-text-secondary)' }}>Owners can't leave — transfer ownership or delete the circle.</p>
                <button className="btn btn-danger" onClick={del}>Delete circle</button>
              </>}
            </div>
          )}
        </>
      );
    };

    const CircleView = ({ circleId, initialChannelId, onBack, onProfileClick, onChanged, onDeleted }) => {
      const ui = useUI();
      const toast = useToast();
      const [circle, setCircle] = useState(null);
      const [layout, setLayout] = useState({ channels: [], folders: [] });
      const [activeCh, setActiveCh] = useState(null);
      const [unread, setUnread] = useState({});
      const [loading, setLoading] = useState(true);
      const [railOpen, setRailOpen] = useState(false);

      const load = useCallback(async () => {
        setLoading(true);
        try {
          const [c, lay] = await Promise.all([api.getCircle(circleId), api.getLayout(circleId)]);
          setCircle(c); setLayout(lay);
          const chs = lay.channels || [];
          setActiveCh(prev => {
            if (prev && chs.find(x => x.id === prev.id)) return prev;
            const wanted = initialChannelId && chs.find(x => x.id === initialChannelId);
            return wanted || chs[0] || null;
          });
          api.getCircleUnread(circleId).then(r => setUnread(r.unread || {})).catch(() => { });
        } catch (e) { toast.error(e.message); }
        setLoading(false);
      }, [circleId, toast, initialChannelId]);

      useEffect(() => { load(); }, [load]);

      const selectCh = (ch) => {
        setActiveCh(ch); setRailOpen(false);
        setUnread(u => ({ ...u, [ch.id]: { ...(u[ch.id] || {}), has_unread: false } }));
      };
      const readAll = async () => {
        try { await api.circleReadAll(circleId); setUnread({}); toast.show('Marked all read.'); } catch (e) { toast.error(e.message); }
      };
      const toggleMute = async () => {
        try { const r = await api.muteCircle(circleId); setCircle(c => ({ ...c, muted: r.muted })); toast.show(r.muted ? 'Muted.' : 'Unmuted.'); }
        catch (e) { toast.error(e.message); }
      };
      const togglePin = async () => {
        try { const r = await api.pinCircle(circleId); setCircle(c => ({ ...c, is_pinned: r.pinned })); toast.show(r.pinned ? 'Pinned.' : 'Unpinned.'); }
        catch (e) { toast.error(e.message); }
      };

      if (loading) return <Spinner />;
      if (!circle) return <div className="empty-state">Circle unavailable.</div>;

      const grouped = layout.folders.map(f => ({ folder: f, channels: layout.channels.filter(c => c.folder_id === f.id) }));
      const noFolder = layout.channels.filter(c => !c.folder_id);

      const renderChannelItem = (ch) => (
        <div key={ch.id} className={`channel-item ${activeCh && activeCh.id === ch.id ? 'active' : ''}`} onClick={() => selectCh(ch)}>
          <span>{ch.channel_type === 'feed' ? '📰' : '#'} {ch.name}{ch.owner_only_posts && <span title="Owner-only posting"> 🔒</span>}</span>
          {unread[ch.id] && unread[ch.id].has_unread && <span className="unread-dot" />}
        </div>
      );

      return (
        <div className="chat-layout">
          <div className={`channel-rail ${railOpen ? 'open' : ''}`}>
            <div className="channel-rail-header">
              <button className="icon-btn" onClick={onBack}><I.Back /></button>
              <Avatar user={{ name: circle.name, photo_url: circle.icon_url }} size={32} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="title" style={{ fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{circle.name}</div>
                <div className="user-handle">{circle.member_count} members</div>
              </div>
              <button className="icon-btn" onClick={() => ui.openModal({
                render: (close) => (
                  <CircleSettings circle={circle} onClose={close} onChanged={(c) => { setCircle(prev => ({ ...prev, ...c })); onChanged && onChanged(c); load(); }} onDeleted={(id) => { onDeleted && onDeleted(id); onBack(); }} onLeft={(id) => { onDeleted && onDeleted(id); onBack(); }} />
                )
              })}><I.Settings /></button>
            </div>

            {circle.banner_url && (
              <div style={{ height: 80, backgroundImage: `url(${circle.banner_url})`, backgroundSize: 'cover', backgroundPosition: 'center', borderBottom: '1px solid var(--gplus-border)' }} />
            )}

            <div style={{ display: 'flex', gap: 6, padding: '8px 12px', borderBottom: '1px solid var(--gplus-border)' }}>
              <button className="btn btn-outline btn-sm" onClick={readAll}>Read all</button>
              <button className="btn btn-outline btn-sm" onClick={toggleMute}>{circle.muted ? 'Unmute' : 'Mute'}</button>
              <button className={`btn btn-sm ${circle.is_pinned ? '' : 'btn-outline'}`} onClick={togglePin}>{circle.is_pinned ? 'Unpin' : 'Pin'}</button>
            </div>
            <div className="channel-list metro-stagger">
              {grouped.map(g => (
                <div key={g.folder.id}>
                  <div className="folder-label">{g.folder.name}</div>
                  {g.channels.map(renderChannelItem)}
                </div>
              ))}
              {noFolder.length > 0 && grouped.length > 0 && <div className="folder-label">Channels</div>}
              {noFolder.map(renderChannelItem)}
              {layout.channels.length === 0 && <div className="empty-state">No channels yet.</div>}
            </div>
          </div>

          {activeCh ? (
            activeCh.channel_type === 'feed'
              ? <ChannelFeed channelId={activeCh.id} channelName={activeCh.name} canPost={!activeCh.owner_only_posts || circle.is_owner} onProfileClick={onProfileClick} />
              : <ChatView channelId={activeCh.id} channelName={activeCh.name} channelDesc={activeCh.description} canModerate={circle.is_owner} canPost={!activeCh.owner_only_posts || circle.is_owner} onProfileClick={onProfileClick}
                headerExtra={<button className="icon-btn rail-toggle" onClick={() => setRailOpen(o => !o)}><I.Menu /></button>} />
          ) : <div className="chat-main"><div className="empty-state">Select a channel.</div></div>}
        </div>
      );
    };

    const PeoplePicker = ({ actionLabel = 'Message', onPick }) => {
      const [q, setQ] = useState('');
      const [results, setResults] = useState([]);
      const [suggestions, setSuggestions] = useState([]);
      const [busy, setBusy] = useState(false);

      useEffect(() => { api.getFollowSuggestions().then(s => setSuggestions(s || [])).catch(() => { }); }, []);
      useEffect(() => {
        if (q.trim().length < 2) { setResults([]); return; }
        let active = true;
        api.searchUsers(q.trim()).then(r => { if (active) setResults(r || []); }).catch(() => { });
        return () => { active = false; };
      }, [q]);

      const list = q.trim().length >= 2 ? results : suggestions;
      const pick = async (u) => { setBusy(true); await onPick(u); setBusy(false); };

      return (
        <div>
          <input className="form-input" placeholder="Search people…" value={q} onChange={e => setQ(e.target.value)} autoFocus />
          <div className="metro-stagger" style={{ marginTop: 12, maxHeight: 340, overflowY: 'auto' }}>
            {q.trim().length < 2 && <div className="folder-label">Suggestions</div>}
            {list.length === 0 && <div className="empty-state">{q.trim().length >= 2 ? 'No users found.' : 'No suggestions.'}</div>}
            {list.map(u => (
              <div key={u.id} className="list-row">
                <Avatar user={u} size={40} />
                <div className="user-info">
                  <div className="user-name">{u.name}</div>
                  <div className="user-handle">+{u.handle}</div>
                </div>
                <button className="btn btn-sm" disabled={busy} onClick={() => pick(u)}>{actionLabel}</button>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const DMsView = ({ onProfileClick }) => {
      const ui = useUI();
      const toast = useToast();
      const [convos, setConvos] = useState([]);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        setLoading(true);
        try { setConvos(await api.getConversations() || []); }
        catch (e) { toast.error(e.message); }
        setLoading(false);
      }, []);
      useEffect(() => { load(); }, [load]);

      const startNew = () => ui.openModal({
        title: 'New message', render: (close) => (
          <PeoplePicker onPick={async (u) => {
            try { const r = await api.startDM(u.id); close(); ui.goDM(r.circle.id); }
            catch (e) { toast.error(e.message); }
          }} />
        )
      });

      if (loading) return <Spinner />;
      return (
        <div className="feed-container metro-stagger">
          <div className="list-header">
            <h2>Messages</h2>
            <button className="btn" onClick={startNew}><I.Plus /> New</button>
          </div>
          {convos.length === 0 && <div className="card empty-state">No conversations yet. Start one!</div>}
          {convos.map((c) => {
            const ou = c.other_user;
            return (
              <div
                key={c.id}
                className={`card list-row ${c.has_unread ? 'has-unread' : ''}`}
                onClick={() => ui.goDM(c.id)}
                style={{ position: 'relative' }}
              >
                <Avatar
                  user={{
                    name: c.display_name,
                    photo_url: c.icon_url || (ou && ou.photo_url),
                    handle: ou && ou.handle,
                  }}
                  size={46}
                />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="user-name">
                    {c.display_name}
                    {c.has_unread && (
                      <span
                        style={{
                          display: 'inline-block',
                          marginLeft: 8,
                          background: 'var(--gplus-red)',
                          color: '#fff',
                          borderRadius: 10,
                          fontSize: 11,
                          padding: '1px 7px',
                          minWidth: 18,
                          textAlign: 'center',
                        }}
                      >
                        {c.unread_count || ''}
                      </span>
                    )}
                  </div>
                  <div
                    className="user-handle"
                    style={{
                      overflow: 'hidden',
                      textOverflow: 'ellipsis',
                      whiteSpace: 'nowrap',
                      fontWeight: c.has_unread ? 600 : 400,
                    }}
                  >
                    {c.last_message ? c.last_message.content : `${c.member_count} members`}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    const DMChatView = ({ circleId, onBack, onProfileClick }) => {
      const toast = useToast();
      const [circle, setCircle] = useState(null);
      const [channel, setChannel] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        let active = true;
        (async () => {
          setLoading(true);
          try {
            const [c, chs] = await Promise.all([api.getCircle(circleId), api.getChannels(circleId)]);
            if (!active) return;
            setCircle(c);
            const chat = (chs || []).find(ch => ch.channel_type === 'chat') || (chs || [])[0];
            setChannel(chat || null);
          } catch (e) { toast.error(e.message); }
          if (active) setLoading(false);
        })();
        return () => { active = false; };
      }, [circleId]);

      if (loading) return <div className="dm-layout"><div className="chat-main"><Spinner /></div></div>;
      if (!channel) return <div className="dm-layout"><div className="chat-main"><div className="chat-header"><button className="icon-btn" onClick={onBack}><I.Back /></button><div className="title">Conversation</div></div><div className="empty-state">This conversation is unavailable.</div></div></div>;

      return (
        <div className="dm-layout">
          <ChatView
            channelId={channel.id}
            channelName={circle ? circle.name : 'Direct message'}
            channelDesc={circle && circle.member_count ? `${circle.member_count} members` : ''}
            canModerate={circle && circle.is_owner}
            onProfileClick={onProfileClick}
            headerExtra={<button className="icon-btn" onClick={onBack}><I.Back /></button>}
          />
        </div>
      );
    };

    const CircleListCard = ({ circle, onOpen, action }) => (
      <div className="card list-row" onClick={onOpen}>
        <Avatar user={{ name: circle.name, photo_url: circle.icon_url }} size={46} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="user-name">{circle.name}</div>
          <div className="user-handle" style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
            {circle.description ? circle.description : `${circle.member_count || 0} members`}
          </div>
        </div>
        {action}
      </div>
    );

    const CreateCircleModal = ({ onClose, onCreated }) => {
      const toast = useToast();
      const [name, setName] = useState('');
      const [isPublic, setIsPublic] = useState(false);
      const [busy, setBusy] = useState(false);

      const create = async () => {
        if (!name.trim()) { toast.error('Give your circle a name.'); return; }
        setBusy(true);
        try {
          const res = await api.createCircle({ name: name.trim(), is_public: isPublic });
          const circle = res.circle || res;
          toast.show('Circle created.');
          onCreated && onCreated(circle);
          onClose();
        } catch (e) { toast.error(e.message); setBusy(false); }
      };

      return (
        <div>
          <div className="form-group">
            <label>Name</label>
            <input className="form-input" autoFocus value={name}
              onChange={e => setName(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && create()}
              placeholder="e.g. Weekend Hikers" />
          </div>
          <div className="settings-row" style={{ padding: '8px 0' }}>
            <div><div>Public</div><div className="user-handle">Anyone can discover and join</div></div>
            <label className="toggle-switch">

    const DiscoverPage = ({ onOpenCircle, loadMine }) => {

        setLoadingDisc(false);
      }, [toast]);

      const joinByCode = async () => {

          const prev = await api.previewInvite(code);

            title: 'Join circle', render: (close) => (

                </div>

    const SettingsView = ({ darkMode, toggleDarkMode, onLogout }) => {
      const auth = useAuth();
      const ui = useUI();
      const toast = useToast();
      const [bgUrl, setBgUrl] = useState(auth.user.background_url || '');
      const [bgMode, setBgMode] = useState(auth.user.background_mode || 'cover');
      const [bgBlur, setBgBlur] = useState(auth.user.background_blur != null ? auth.user.background_blur : 10);
      const bgRef = useRef(null);
      const blurTimer = useRef(null);

      const applyBackground = (url, mode, blur) => {
        const blurPx = (blur != null ? blur : 10);
        document.body.style.backgroundImage = '';
        document.documentElement.style.setProperty('--bg-blur', `${blurPx}px`);
        if (url) {
          document.documentElement.style.setProperty('--body-bg-image', `url(${url})`);
          if (mode === 'tile') {
            document.body.classList.add('bg-tile');
          } else {
            document.body.classList.remove('bg-tile');
          }
          getDominantColor(url, (color) => document.documentElement.style.setProperty('--gplus-red', color));
        } else {
          const DEFAULT_BG = darkMode
            ? 'https://cinemint.online/mylo/background.jpg'
            : 'https://cinemint.online/mylo/background-lite.jpg';
          document.documentElement.style.setProperty('--body-bg-image', `url(${DEFAULT_BG})`);
          document.body.classList.remove('bg-tile');
          document.documentElement.style.setProperty('--gplus-red', '#1BA1E2');
        }
      };

      useEffect(() => {
        if (auth.user) applyBackground(auth.user.background_url, auth.user.background_mode || 'cover', auth.user.background_blur != null ? auth.user.background_blur : 10);
      }, [darkMode]);

      const uploadBg = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fd = new FormData(); fd.append('file', file);
        try {
          const res = await api.uploadBackground(fd);
          setBgUrl(res.url);
          auth.setUser({ ...auth.user, background_url: res.url });
          applyBackground(res.url, bgMode, bgBlur);
          toast.show('Background updated.');
        } catch (err) { toast.error(err.message); }
        if (bgRef.current) bgRef.current.value = '';
      };
      const removeBg = async () => {
        try {
          await api.deleteBackground();
          setBgUrl('');
          auth.setUser({ ...auth.user, background_url: null });
          applyBackground('', bgMode, bgBlur);
          toast.show('Background removed.');
        } catch (err) { toast.error(err.message); }
      };
      const changeMode = async (mode) => {
        setBgMode(mode);
        try { await api.setBackgroundMode(mode); auth.setUser({ ...auth.user, background_mode: mode }); applyBackground(bgUrl, mode, bgBlur); }
        catch (err) { toast.error(err.message); }
      };
      const changeBlur = (blur) => {
        setBgBlur(blur);
        applyBackground(bgUrl, bgMode, blur);
        if (blurTimer.current) clearTimeout(blurTimer.current);
        blurTimer.current = setTimeout(async () => {
          try { await api.setBackgroundBlur(blur); auth.setUser({ ...auth.user, background_blur: blur }); }

      });
      const confirmLogout = () => ui.openModal({

          <ConfirmDialog title="Log out?" message="You'll need to sign in again." confirmLabel="Log out" onClose={close}
            onConfirm={async () => { close(); onLogout(); }} />

      return (

            <div className="settings-row">

            </div>
            {bgUrl && (
              <div className="settings-row">
                <span>Background mode</span>
                <select className="form-input" style={{ width: 'auto' }} value={bgMode} onChange={e => changeMode(e.target.value)}>
                  <option value="cover">Cover</option>
                  <option value="tile">Tile</option>

            {bgUrl && bgMode !== 'tile' && (
              <div className="settings-row" style={{ alignItems: 'center' }}>
                <div><div>Background blur</div><div className="user-handle">Soften the wallpaper behind the app</div></div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>

          <div className="card">

              <button className="btn btn-sm" style={{ background: '#b00020' }} onClick={confirmDelete}>Delete</button>
            </div>
          </div>

    /* ============================ AUTH ============================ */
    const AuthScreen = ({ initialResetToken, onAuthed }) => {
      const [mode, setMode] = useState(initialResetToken ? 'reset' : 'login'); // login | register | forgot | reset
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [handle, setHandle] = useState('');
      const [fullname, setFullname] = useState('');
      const [token, setToken] = useState(initialResetToken || '');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [info, setInfo] = useState('');

      const submit = async (e) => {
        e.preventDefault();
        setLoading(true); setError(''); setInfo('');
        try {
          if (mode === 'login') {
            const res = await api.login(email, password);
            onAuthed(res.user);
          } else if (mode === 'register') {
            await api.register({ email, password, handle, fullname });
            const res = await api.login(email, password);
            onAuthed(res.user);
          } else if (mode === 'forgot') {
            const res = await api.forgotPassword(email);
            setInfo((res && res.message) || 'If an account exists, a reset link has been sent.');
          } else if (mode === 'reset') {
            await api.resetPassword(token, password);
            setInfo('Password reset. You can sign in now.');
            setMode('login'); setPassword('');
          }
        } catch (err) { setError(err.message); }
        setLoading(false);
      };

      const titles = { login: 'Sign in', register: 'Create account', forgot: 'Reset password', reset: 'Set a new password' };

      return (
        <div className="auth-container">
          <div className="auth-card">
            <div className="auth-title">
              <div className="logo" style={{ justifyContent: 'center', marginBottom: 8 }}>
                <img src="https://cinemint.online/mylo/mylogo.png" alt="Mylo" />

            {error && <div className="auth-msg error">{error}</div>}
            {info && <div className="auth-msg info">{info}</div>}

            <form onSubmit={submit}>
              {mode === 'register' && (
                <>
                  <div className="form-group"><input className="form-input" placeholder="Full name" value={fullname} onChange={e => setFullname(e.target.value)} required /></div>
                  <div className="form-group"><input className="form-input" placeholder="Username (handle)" value={handle} onChange={e => setHandle(e.target.value)} required /></div>
                </>
              )}
              {(mode === 'login' || mode === 'register' || mode === 'forgot') && (
                <div className="form-group"><input className="form-input" type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} required /></div>
              )}
              {mode === 'reset' && (
                <div className="form-group"><input className="form-input" placeholder="Reset token" value={token} onChange={e => setToken(e.target.value)} required /></div>
              )}
              {(mode === 'login' || mode === 'register' || mode === 'reset') && (
                <div className="form-group"><input className="form-input" type="password" placeholder={mode === 'reset' ? 'New password' : 'Password'} value={password} onChange={e => setPassword(e.target.value)} required /></div>
              )}
              <button type="submit" className="btn" style={{ width: '100%', justifyContent: 'center' }} disabled={loading}>
                {loading ? 'Please wait…' : titles[mode]}
              </button>
            </form>

            <div className="auth-links">
              {mode === 'login' && <>
                <button className="link-btn" onClick={() => { setMode('register'); setError(''); setInfo(''); }}>Create account</button>
                <button className="link-btn" onClick={() => { setMode('forgot'); setError(''); setInfo(''); }}>Forgot password?</button>
              </>}
              {mode === 'register' && <button className="link-btn" onClick={() => { setMode('login'); setError(''); setInfo(''); }}>Have an account? Sign in</button>}
              {(mode === 'forgot' || mode === 'reset') && <button className="link-btn" onClick={() => { setMode('login'); setError(''); setInfo(''); }}>Back to sign in</button>}
              {mode === 'forgot' && <button className="link-btn" onClick={() => { setMode('reset'); setError(''); setInfo(''); }}>I have a reset token</button>}
            </div>
          </div>
        </div>

    const Sidebar = ({ page, activeCircle, onNavigate, isOpen, close, badges, myCircles, unreadCircles, onOpenCircle, loadMyCircles, onResizeStart }) => {

    const ToastHost = ({ toasts }) => (

    const ModalHost = ({ modals, onClose }) => (
      <>
        {modals.map((m, i) => (

            {m.render(() => onClose(m.id))}
          </Modal>
        ))}
