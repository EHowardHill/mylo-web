    /* ============================ API LAYER ============================ */
    async function request(path, options = {}) {
      const opts = { ...options, credentials: 'include', headers: { ...(options.headers || {}) } };
      const isForm = options.body instanceof FormData;
      if (options.body && !isForm && !opts.headers['Content-Type']) {
        opts.headers['Content-Type'] = 'application/json';
      }
      if (options.body && typeof options.body === 'object' && !isForm) {
        opts.body = JSON.stringify(options.body);
      }
      const res = await fetch(`${API_BASE}${path}`, opts);
      if (res.status === 204) return null;
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) {
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || data.message || 'Something went wrong.');
        return data;
      }
      const text = await res.text();
      if (!res.ok) throw new Error(text || 'Something went wrong.');
      return text;
    }

    const qs = (params) => {
      const clean = {};
      Object.keys(params || {}).forEach(k => {
        if (params[k] !== undefined && params[k] !== null && params[k] !== '') clean[k] = params[k];
      });
      const s = new URLSearchParams(clean).toString();
      return s ? `?${s}` : '';
    };

    const AuthContext = createContext(null);

    const EMOJIS = ['👍', '❤️', '😂', '🎉', '😮', '😢', '🔥', '👏', '🙏', '💯', '😍', '🤔', '✅', '👀', '🚀', '💀'];

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatText(text) {
      if (!text) return '';
      let html = escapeHtml(text);
      html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/(^|[^*])\*([^*]+?)\*/g, '$1<em>$2</em>');
      html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');
      html = html.replace(/\|\|(.*?)\|\|/g, '<span class="spoiler" onclick="this.classList.add(\'revealed\')">$1</span>');
      html = html.replace(/(^|\s)\+(\w+)/g, '$1<span class="mention" data-handle="$2">+$2</span>');
      html = html.replace(/(^|\s)#([\w-]+)/g, '$1<span class="channel-link">#$2</span>');
      html = html.replace(/(?:^|\s)(https?:\/\/)?(m\.|www\.)?(youtube\.com\/(?:watch\?v=|shorts\/|live\/)|youtu\.be\/)([\w-]+)(\S*)/g, (match, proto, host, path, videoId) => {
        return ` <div class="yt-embed"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`;
      });
      html = html.replace(/(?:^|\s)(https?:\/\/)?(m\.|www\.)?soundcloud\.com\/((?:[\w-]+\/)+[\w-]+)(\S*)/g, (match, proto, host, path) => {
        const isSet = /\/sets\//.test(path);
        const widgetUrl = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent('https://soundcloud.com/' + path) + '&amp;color=%231BA1E2&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_reposts=false&amp;visual=false';
        return ` <div class="sc-embed${isSet ? ' sc-set' : ''}"><iframe src="${widgetUrl}" scrolling="no" allow="autoplay"></iframe></div>`;
      });
      html = html.replace(/(^|[^"=\/])(https?:\/\/[^\s<]+\.(?:mp4|webm|mov|mkv|avi))(\?[^\s<]*)?/gi, (match, pre, url) => `${pre}<br><video src="${url}" controls preload="metadata" style="width:100%;max-height:320px"></video>`);
      html = html.replace(/(^|[^"=\/])(https?:\/\/[^\s<]+\.(?:mp3|wav|ogg|flac|aac|m4a))(\?[^\s<]*)?/gi, (match, pre, url) => `${pre}<br><audio src="${url}" controls preload="metadata" style="width:100%"></audio>`);
      html = html.replace(/(^|[^"=\/])(https?:\/\/[^\s<]+\.(?:jpg|jpeg|png|gif|webp))(\?[^\s<]*)?/gi, (match, pre, url) => `${pre}<br><img src="${url}" class="msg-embed" alt="Image embed" loading="lazy" />`);
      html = html.replace(/(^|[^"=\/])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
      return html;
    }

    function timeAgo(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const s = Math.floor((Date.now() - d.getTime()) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm';
      if (s < 86400) return Math.floor(s / 3600) + 'h';
      if (s < 604800) return Math.floor(s / 86400) + 'd';
      return d.toLocaleDateString();
    }

    function clockTime(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function getDominantColor(imageSrc, callback) {
      const img = new Image();
      img.crossOrigin = "Anonymous";
      img.onload = function () {
        try {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 5; canvas.height = 5;
          ctx.drawImage(img, 0, 0, 5, 5);
          const data = ctx.getImageData(0, 0, 5, 5).data;
          let r = 0, g = 0, b = 0;
          for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i + 1]; b += data[i + 2]; }
          r = Math.floor(r / 25); g = Math.floor(g / 25); b = Math.floor(b / 25);
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          if (max - min < 50) r = Math.min(255, r + 50);
          callback(`rgb(${r}, ${g}, ${b})`);
        } catch (e) { callback('#db4437'); }
      };
      img.onerror = () => callback('#db4437');
      img.src = imageSrc;
    }

    function fallbackAvatar(u) {
      const name = (u && (u.name || u.handle)) || 'User';
      return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`;
    }

    const Avatar = ({ user, size = 40, onClick, className = 'avatar' }) => {
      const u = user || {};
      return (
        <img
          src={u.photo_url || u.user_photo || fallbackAvatar(u)}
          className={className}
          style={{ width: size, height: size, cursor: onClick ? 'pointer' : 'default' }}
          onClick={onClick}
          alt={u.name || u.handle || 'User'}
          onError={(e) => { e.target.onerror = null; e.target.src = fallbackAvatar(u); }}
        />
      );
    };

    const Spinner = () => <div className="spinner"></div>;

    const Modal = ({ title, children, onClose, wide }) => (
      <div className="modal-overlay" onClick={onClose}>
        <div className={`modal ${wide ? 'modal-wide' : ''}`} onClick={e => e.stopPropagation()}>
          {title && (
            <div className="modal-header">
              <h3>{title}</h3>
              <button className="icon-btn" onClick={onClose}><I.Close /></button>
            </div>
          )}
          <div className="modal-body">{children}</div>
        </div>
      </div>
    );

    const ConfirmDialog = ({ title, message, confirmLabel = 'Confirm', danger, onConfirm, onClose }) => {
      const [busy, setBusy] = useState(false);
      return (
        <div>
          {title && (
            <h3 style={{ fontWeight: 'normal', textTransform: 'lowercase', fontSize: 28, marginBottom: 16 }}>
              {title}
            </h3>
          )}
          <p style={{ marginBottom: 20 }}>{message}</p>
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button className="btn btn-outline" onClick={onClose}>Cancel</button>
            <button
              className={`btn ${danger ? 'btn-danger' : ''}`}
              disabled={busy}
              onClick={async () => { setBusy(true); try { await onConfirm(); onClose(); } catch (e) { setBusy(false); } }}
            >{busy ? 'Working…' : confirmLabel}</button>
          </div>
        </div>
      );
    };

    const EmojiPicker = ({ onPick }) => (
      <div className="emoji-bar">
        {EMOJIS.map(e => <button key={e} onClick={() => onPick(e)}>{e}</button>)}
      </div>
    );

    const GifPicker = ({ onPick, onClose }) => {
      const toast = useToast();
      const [q, setQ] = useState('');
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async (query) => {
        setLoading(true);
        try {
          const res = query ? await api.gifSearch(query) : await api.gifTrending();
          setResults(res.results || []);
        } catch (e) { toast.error(e.message); }
        setLoading(false);
      }, [toast]);

      useEffect(() => { load(''); }, [load]);
      useEffect(() => {
        const t = setTimeout(() => load(q), 350);
        return () => clearTimeout(t);
      }, [q, load]);

      return (
        <Modal title="Pick a GIF" onClose={onClose}>
          <input className="form-input" placeholder="Search GIFs" value={q} autoFocus onChange={e => setQ(e.target.value)} style={{ marginBottom: 12 }} />
          {loading ? <Spinner /> : (
            <div className="gif-grid metro-stagger">
              {results.map((g, i) => (
                <img key={i} src={g.thumb || g.url} onClick={() => { onPick(g.url); onClose(); }} alt="gif" />
              ))}
              {results.length === 0 && <div className="empty-state">No GIFs found.</div>}
            </div>
          )}
        </Modal>
      );
    };

    const UserRow = ({ user, onProfileClick, right }) => (
      <div className="list-row">
        <Avatar user={user} size={40} onClick={() => onProfileClick && onProfileClick(user.handle)} />
        <div className="user-info">
          <div className="user-name" onClick={() => onProfileClick && onProfileClick(user.handle)}>{user.name}</div>
          <div className="user-handle">+{user.handle}{user.status_text ? ` · ${user.status_emoji || ''} ${user.status_text}` : ''}</div>

        {right}
      </div>

    const RichText = ({ text, html, onMention }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (!ref.current || !onMention) return;
        const handler = (e) => {
          const m = e.target.closest('.mention');
          if (m && m.dataset.handle) { e.preventDefault(); e.stopPropagation(); onMention(m.dataset.handle); }
        };
        ref.current.addEventListener('click', handler);
        return () => ref.current && ref.current.removeEventListener('click', handler);
      }, [onMention, text, html]);
      const htmlContent = html || formatText(text);
      return <div ref={ref} dangerouslySetInnerHTML={{ __html: htmlContent }} />;
    };

    const MentionInput = ({
      value, onChange, onSubmit, multiline = false,
      className = 'form-input', placeholder, autoFocus, rows, style,
    }) => {
      const inputRef = useRef(null);
      const [open, setOpen] = useState(false);
      const [items, setItems] = useState([]);
      const [active, setActive] = useState(0);
      const [loading, setLoading] = useState(false);
      const [rect, setRect] = useState(null);
      const mentionRef = useRef(null);
      const seqRef = useRef(0);
      const debounceRef = useRef(null);

      const detect = (text, caret) => {
        const before = text.slice(0, caret);
        const m = before.match(/(?:^|\s)\+(\w*)$/);
        if (!m) return null;
        return { start: caret - m[1].length - 1, query: m[1] };
      };

      const runSearch = (q) => {
        const mySeq = ++seqRef.current;
        setLoading(true);
        const req = q.trim().length >= 1 ? api.searchUsers(q.trim()) : api.getFollowSuggestions();
        req.then((res) => {
          if (mySeq !== seqRef.current) return;
          setItems((res || []).slice(0, 6));
          setActive(0);
          setLoading(false);
        }).catch(() => { if (mySeq === seqRef.current) { setItems([]); setLoading(false); } });
      };

      const scheduleSearch = (q) => {
        clearTimeout(debounceRef.current);
        debounceRef.current = setTimeout(() => runSearch(q), 200);
      };

      const sync = (el) => {
        const ctx = detect(el.value, el.selectionStart);
        mentionRef.current = ctx;
        if (ctx) { setOpen(true); scheduleSearch(ctx.query); }
        else { setOpen(false); }
      };

      const handleChange = (e) => { onChange(e.target.value); sync(e.target); };

      const pick = (u) => {
        const ctx = mentionRef.current;
        const el = inputRef.current;
        if (!ctx || !el) return;
        const caret = el.selectionStart;
        const before = value.slice(0, ctx.start);
        const after = value.slice(caret);
        const insert = `+${u.handle} `;
        onChange(before + insert + after);
        setOpen(false);
        mentionRef.current = null;
        const pos = (before + insert).length;
        requestAnimationFrame(() => {
          if (inputRef.current) { inputRef.current.focus(); inputRef.current.setSelectionRange(pos, pos); }
        });
      };

      const handleKeyDown = (e) => {
        if (open && items.length > 0) {
          if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => (a + 1) % items.length); return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); setActive(a => (a - 1 + items.length) % items.length); return; }
          if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pick(items[active]); return; }
          if (e.key === 'Escape') { e.preventDefault(); setOpen(false); return; }
        }
        if (onSubmit && e.key === 'Enter' && (!multiline || !e.shiftKey)) { e.preventDefault(); onSubmit(); }
      };

      // Keep the portaled menu anchored to the input while open.
      useEffect(() => {
        if (!open) { setRect(null); return; }
        const measure = () => { if (inputRef.current) setRect(inputRef.current.getBoundingClientRect()); };
        measure();
        window.addEventListener('scroll', measure, true);
        window.addEventListener('resize', measure);
        return () => {
          window.removeEventListener('scroll', measure, true);
          window.removeEventListener('resize', measure);
        };
      }, [open]);

      const MENU_MAX = 240;
      const above = rect && rect.top > MENU_MAX + 20;
      const menuStyle = rect ? {
        position: 'fixed',
        left: rect.left,
        width: rect.width,
        ...(above ? { bottom: window.innerHeight - rect.top + 4 } : { top: rect.bottom + 4 }),
      } : {};

      const commonProps = {
        ref: inputRef, className, placeholder, autoFocus,
        style: { width: '100%', ...(style || {}) },
        value, onChange: handleChange, onKeyDown: handleKeyDown,
        onKeyUp: (e) => { if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) sync(e.target); },
        onClick: (e) => sync(e.target),
        onBlur: () => setTimeout(() => setOpen(false), 150),
      };

      return (
        <div className="mention-wrap">
          {multiline ? <textarea {...commonProps} rows={rows || 1} /> : <input {...commonProps} />}
          {open && rect && ReactDOM.createPortal(
            <div className="mention-menu" style={menuStyle}>
              {items.length === 0
                ? <div className="mention-empty">{loading ? 'searching…' : 'no matches'}</div>
                : items.map((u, i) => (
                  <div key={u.id} className={`mention-item ${i === active ? 'active' : ''}`}
                    onMouseDown={(e) => { e.preventDefault(); pick(u); }}
                    onMouseEnter={() => setActive(i)}>
                    <img src={u.photo_url || fallbackAvatar(u)} alt=""
                      onError={(e) => { e.target.onerror = null; e.target.src = fallbackAvatar(u); }} />
                    <div className="mention-meta">
                      <div className="mention-name">{u.name}</div>
                      <div className="mention-handle">+{u.handle}</div>
                    </div>
                  </div>
                ))}
            </div>,
            document.body
          )}
        </div>
      );
    };

    const PollView = ({ post, onUpdate }) => {
      const toast = useToast();
      const ui = useUI();
      const auth = useAuth();
      const poll = post.poll;
      const voted = poll.my_vote !== null && poll.my_vote !== undefined;
      const isAuthor = post.user_id === (auth && auth.user && auth.user.id);

      const vote = async (id) => {
        try { const res = await api.votePoll(post.id, id); onUpdate({ ...post, poll: res.poll }); }
        catch (e) { toast.error(e.message); }
      };
      const unvote = async () => {
        try { const res = await api.unvotePoll(post.id); onUpdate({ ...post, poll: res.poll || { ...poll, my_vote: null } }); }
        catch (e) { toast.error(e.message); }
      };
      const close = async () => {
        try { await api.closePoll(post.id); onUpdate({ ...post, poll: { ...poll, closed: true } }); toast.show('Poll closed.'); }
        catch (e) { toast.error(e.message); }
      };
      const showVoters = async (opt) => {
        try {
          const voters = await api.getPollVoters(post.id, opt.id);
          ui.openModal({
            title: `Voted "${opt.text}"`, render: (close) => (
              <div className="metro-stagger">
                {(voters || []).map((v, i) => <UserRow key={i} user={v} onProfileClick={(h) => { close(); ui.goProfile(h); }} />)}
                {(!voters || voters.length === 0) && <div className="empty-state">No voters yet.</div>}
              </div>
            )
          });
        } catch (e) { toast.error(e.message); }
      };

      return (
        <div style={{ padding: '0 16px 16px' }}>
          {poll.options.map(opt => (
            <div key={opt.id} className="poll-option" onClick={() => (!voted && !poll.closed) ? vote(opt.id) : showVoters(opt)}>
              {(voted || poll.closed) && <div className="poll-bar" style={{ width: `${opt.pct}%` }} />}
              <div className="poll-content">
                <span>{opt.text}{poll.my_vote === opt.id ? ' ✓' : ''}</span>
                {(voted || poll.closed) && <span>{opt.pct}% · {opt.count}</span>}
              </div>
            </div>
          ))}
          <div style={{ fontSize: 12, color: 'var(--gplus-text-secondary)', marginTop: 8, display: 'flex', gap: 12, alignItems: 'center' }}>
            <span>{poll.total_votes} votes{poll.closed ? ' · Closed' : ''}</span>
            {voted && !poll.closed && <button className="link-btn" onClick={unvote}>Remove vote</button>}
            {isAuthor && !poll.closed && <button className="link-btn" onClick={close}>Close poll</button>}
          </div>
        </div>
      );
    };

    const Post = React.memo(({ post: initial, onProfileClick, onUpdate, onDeleted, hideActions }) => {
      const auth = useAuth();
      const ui = useUI();
      const toast = useToast();
      const [post, setPost] = initial ? useState(initial) : [null, () => { }];
      useEffect(() => setPost(initial), [initial]);

      const [showComments, setShowComments] = useState(false);
      const [commentText, setCommentText] = useState('');
      const [comments, setComments] = useState(initial.comments || []);
      const [plusActive, setPlusActive] = useState(initial.liked_by_me);
      const [plusCount, setPlusCount] = useState(initial.plus_one_count || 0);
      const [menuOpen, setMenuOpen] = useState(false);

      if (!post) return null;

      const update = (p) => { setPost(p); onUpdate && onUpdate(p); };
      const isAuthor = post.user_id === (auth.user && auth.user.id);

      const plusOne = async () => {
        try { const res = await api.plusOnePost(post.id); setPlusActive(res.active); setPlusCount(res.count); }
        catch (e) { toast.error(e.message); }
      };
      const addComment = async () => {
        if (!commentText.trim()) return;
        try {
          const res = await api.addComment(post.id, commentText);
          const c = {
            _id: res.comment_id, user_id: auth.user.id, text: res.text, timestamp: res.timestamp,
            user_name: res.user_name, user_handle: res.user_handle, user_photo: res.user_photo, plus_oners: []
          };
          setComments(prev => [...prev, c]);
          setCommentText('');
        } catch (e) { toast.error(e.message); }
      };
      const removeComment = async (cid) => {
        try { await api.deleteComment(post.id, cid); setComments(prev => prev.filter(c => c._id !== cid)); }
        catch (e) { toast.error(e.message); }
      };
      const plusComment = async (cid) => {
        try {
          const res = await api.plusOneComment(post.id, cid);
          setComments(prev => prev.map(c => c._id === cid ? { ...c, _liked: res.active, _likeCount: res.count } : c));
        } catch (e) { toast.error(e.message); }
      };
      const showLikes = async () => {
        try {
          const likes = await api.getPostLikes(post.id);
          ui.openModal({
            title: '+1s', render: (close) => (
              <div className="metro-stagger">
                {(likes || []).map((u, i) => <UserRow key={i} user={u} onProfileClick={(h) => { close(); onProfileClick(h); }} />)}
                {(!likes || likes.length === 0) && <div className="empty-state">No +1s yet.</div>}
              </div>
            )
          });
        } catch (e) { toast.error(e.message); }
      };
      const doDelete = () => ui.openModal({
        render: (close) => (
          <ConfirmDialog title="Delete post?" message="This permanently removes the post and its media." confirmLabel="Delete" danger
            onConfirm={async () => { await api.deletePost(post.id); toast.show('Post deleted.'); onDeleted && onDeleted(post.id); }} onClose={close} />
        )
      });
      const doReport = async () => {
        try { await api.reportPost(post.id); toast.show('Post hidden from your feeds.'); onDeleted && onDeleted(post.id); }
        catch (e) { toast.error(e.message); }
      };
      const doPin = async () => {
        try { const res = await api.pinPost(post.id); update({ ...post, pinned: res.pinned }); toast.show(res.pinned ? 'Pinned.' : 'Unpinned.'); }
        catch (e) { toast.error(e.message); }
      };
      const permalink = () => ui.openModal({
        title: 'Post link',
        render: (close) => <PostLinkModal postId={post.id} onClose={close} />
      });
      const reshare = () => ui.openCompose({ reshare: post });
      const openReshared = async () => {
        if (!rs || !rs.id) return;
        try {
          const res = await api.getPublicPost(rs.id);
          ui.openModal({
            title: 'post',
            wide: true,
            render: (close) => (
              <Post post={res.post} onProfileClick={(h) => { close(); onProfileClick(h); }} />
            ),
          });
        } catch (e) { toast.error(e.message || 'Could not open post'); }
      };

      const rs = post.reshared_post;

      return (
        <div className="card">
          <div className="card-header">
            <Avatar user={{ name: post.user_name, photo_url: post.user_photo, handle: post.user_handle }} onClick={() => onProfileClick(post.user_handle)} />
            <div className="user-info">
              <div className="user-name" onClick={() => onProfileClick(post.user_handle)}>{post.user_name}</div>
              <div className="user-handle">+{post.user_handle} · {post.timestamp}{post.pinned ? ' · 📌 pinned' : ''}</div>
              {post.source_channel && <div style={{ fontSize: 11, color: 'var(--gplus-text-secondary)' }}>in {post.source_channel.circle_name} · #{post.source_channel.channel_name}</div>}
            </div>
            <div style={{ position: 'relative' }}>
              <button className="icon-btn" onClick={() => setMenuOpen(o => !o)}><I.More /></button>
              {menuOpen && (
                <div className="card dropdown-menu metro-anim" style={{ position: 'absolute', right: 0, top: 36, zIndex: 20, minWidth: 160, margin: 0 }} onMouseLeave={() => setMenuOpen(false)}>
                  <div className="nav-item" onClick={() => { permalink(); setMenuOpen(false); }}>Copy link</div>
                  {post.source_channel && post.source_channel.is_owner && (
                    <div className="nav-item" onClick={() => { doPin(); setMenuOpen(false); }}>{post.pinned ? 'Unpin' : 'Pin to circle'}</div>
                  )}
                  {isAuthor && <div className="nav-item" onClick={() => { showLikes(); setMenuOpen(false); }}>See who +1'd</div>}
                  {!isAuthor && <div className="nav-item" onClick={() => { doReport(); setMenuOpen(false); }}>Report / hide</div>}
                  {isAuthor && <div className="nav-item" style={{ color: '#b00020' }} onClick={() => { doDelete(); setMenuOpen(false); }}>Delete</div>}
                </div>
              )}
            </div>
          </div>

          {post.text && <div className="post-content"><RichText text={post.text} onMention={onProfileClick} /></div>}

          {post.images && post.images.length > 0 && (
            <div className={`post-images ${post.images.length === 1 ? 'single' : ''}`}>
              {post.images.map((src, i) => <img key={i} src={src} alt="Post media" onClick={() => ui && ui.openLightbox(src)} />)}
            </div>
          )}
          {post.videos && post.videos.length > 0 && (
            <div className="post-images single">
              {post.videos.map((src, i) => <video key={i} src={src} controls poster={(post.video_thumbnails || [])[i]} style={{ width: '100%', objectFit: 'cover' }} />)}
            </div>
          )}

          {post.audio_urls && post.audio_urls.length > 0 && (
            <div className="post-audio" style={{ marginTop: (post.images && post.images.length) || (post.videos && post.videos.length) ? 8 : 0 }}>
              {post.audio_urls.map((src, i) => (
                <div key={i} style={{ marginBottom: 4 }}>
                  {(post.audio_titles || [])[i] && (
                    <div style={{ fontSize: 12, color: 'var(--gplus-text-secondary)', display: 'flex', alignItems: 'center', gap: 4, marginBottom: 2 }}>
                      <I.Music /> <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{(post.audio_titles || [])[i]}</span>
                    </div>
                  )}
                  <audio src={src} controls preload="metadata" style={{ width: '100%' }} />
                </div>
              ))}
            </div>
          )}

          {rs && (
            <div className="reshare-box" style={{ cursor: 'pointer' }} onClick={openReshared}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                <Avatar user={{ name: rs.user_name, photo_url: rs.user_photo, handle: rs.user_handle }} size={28} onClick={(e) => { e.stopPropagation(); onProfileClick(rs.user_handle); }} />
                <div className="user-name" style={{ fontSize: 14 }} onClick={(e) => { e.stopPropagation(); onProfileClick(rs.user_handle); }}>{rs.user_name}</div>
                <span className="user-handle">+{rs.user_handle}</span>
              </div>
              {rs.text && <div style={{ lineHeight: 1.4 }}><RichText text={rs.text} onMention={onProfileClick} /></div>}
              {rs.images && rs.images.length > 0 && (
                <div className={`post-images ${rs.images.length === 1 ? 'single' : ''}`} style={{ marginTop: 8 }}>
                  {rs.images.map((s, i) => <img key={i} src={s} onClick={(e) => { e.stopPropagation(); ui && ui.openLightbox(s); }} alt="" />)}
                </div>
              )}
              {rs.audio_urls && rs.audio_urls.length > 0 && (
                <div style={{ marginTop: 8 }} onClick={(e) => e.stopPropagation()}>
                  {rs.audio_urls.map((src, i) => (
                    <div key={i} style={{ marginBottom: 4 }}>
                      {(rs.audio_titles || [])[i] && (
                        <div style={{ fontSize: 12, color: 'var(--gplus-text-secondary)', display: 'flex', alignItems: 'center', gap: 4, marginBottom: 2 }}>
                          <I.Music /> <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{(rs.audio_titles || [])[i]}</span>
                        </div>
                      )}
                      <audio src={src} controls preload="metadata" style={{ width: '100%' }} />
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {post.poll && <PollView post={post} onUpdate={update} />}

          {!hideActions && (
            <div className="card-actions">
              <button className={`action-btn ${plusActive ? 'active' : ''}`} onClick={plusOne} onContextMenu={(e) => { e.preventDefault(); showLikes(); }} title="Right-click to see who +1'd">
                <I.PlusOne /> {plusCount > 0 && plusCount}
              </button>
              <button className="action-btn" onClick={() => setShowComments(s => !s)}>
                <I.Comment /> {(comments.length || post.comments_count) > 0 && (comments.length || post.comments_count)}
              </button>
              <button className="action-btn" onClick={reshare}><I.Share /> Reshare</button>
            </div>
          )}

          {showComments && (
            <div className="comment-section metro-stagger">
              {comments.map(c => (
                <div key={c._id} className="comment">
                  <Avatar user={{ name: c.user_name, photo_url: c.user_photo, handle: c.user_handle }} size={32} onClick={() => onProfileClick(c.user_handle)} />
                  <div className="comment-content">
                    <div className="user-name" style={{ fontSize: 13, marginBottom: 4 }} onClick={() => onProfileClick(c.user_handle)}>
                      {c.user_name}
                    </div>
                    <div className="comment-box">
                      <RichText text={c.text} onMention={onProfileClick} />
                    </div>
                    <div style={{ fontSize: 11, color: 'var(--gplus-text-secondary)', marginTop: 4, display: 'flex', gap: 12 }}>
                      <span>{timeAgo(c.timestamp)}</span>
                      <button className="link-btn" style={{ fontSize: 11 }} onClick={() => plusComment(c._id)}>+1{c._likeCount ? ` ${c._likeCount}` : ''}</button>
                      {c.user_id === (auth.user && auth.user.id) && <button className="link-btn" style={{ fontSize: 11 }} onClick={() => removeComment(c._id)}>Delete</button>}
                    </div>
                  </div>
                </div>
              ))}
              <div className="comment" style={{ marginTop: 12 }}>
                <Avatar user={auth.user} size={32} />
                <div style={{ flex: 1, display: 'flex', gap: 8 }}>
                  <MentionInput placeholder="Add a comment…" value={commentText}
                    onChange={setCommentText} onSubmit={addComment} style={{ borderRadius: 16 }} />
                  <button className="btn btn-outline" onClick={addComment}>Post</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    });

    const PostLinkModal = ({ postId, onClose }) => {
      const [copied, setCopied] = useState(false);
      const url = `${PUBLIC_BASE}${postId}`;
      const copy = () => {
        navigator.clipboard.writeText(url).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }).catch(() => { });
      };
      return (
        <div>
          <p style={{ marginBottom: 12, color: 'var(--gplus-text-secondary)' }}>Share this link to let anyone view the post (no login required).</p>
          <div style={{ display: 'flex', gap: 8 }}>
            <input className="form-input" readOnly value={url} onFocus={e => e.target.select()} style={{ flex: 1 }} />
            <button className="btn" onClick={copy}>{copied ? 'Copied!' : 'Copy'}</button>
            <a className="btn btn-outline" href={`https://cinemint.online/mylo/post/${postId}`} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
              <I.ExternalLink /> Open
            </a>
          </div>
        </div>
      );
    };

    const PublicPostView = ({ postId }) => {
      const [post, setPost] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');

      useEffect(() => {
        (async () => {
          try {
            const res = await api.getPublicPost(postId);
            setPost(res.post);
          } catch (e) { setError(e.message); }
          setLoading(false);
        })();
      }, [postId]);

      if (loading) return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Spinner /></div>;
      if (error) return (
        <div className="auth-container">
          <div className="auth-card">
            <div className="auth-title"><h2>Post not found</h2></div>
            <p style={{ textAlign: 'center', color: 'var(--gplus-text-secondary)' }}>{error}</p>
            <div className="auth-links"><a className="btn" href="/" style={{ textDecoration: 'none' }}>Go to Mylo</a></div>
          </div>
        </div>
      );
      if (!post) return null;

      return (
        <div className="auth-container" style={{ alignItems: 'flex-start', paddingTop: 40 }}>
          <div className="auth-card page-transition" style={{ maxWidth: 600, width: '100%' }}>
            <div className="auth-title">
              <div className="logo" style={{ justifyContent: 'center', marginBottom: 16 }}>
                <img src="https://cinemint.online/mylo/mylogo.png" alt="Mylo" />
              </div>
            </div>
            <Post post={post} hideActions onProfileClick={() => { }} />
            <div className="auth-links">
              <a className="btn" href="/" style={{ textDecoration: 'none' }}>Sign in to interact</a>
            </div>
          </div>
        </div>
      );
    };

    const ComposeModal = ({ reshare, defaultChannelId, onClose, onCreated }) => {
      const auth = useAuth();
      const toast = useToast();
      const [text, setText] = useState('');
      const [files, setFiles] = useState([]);
      const [pollOpts, setPollOpts] = useState(null);
      const [channelId, setChannelId] = useState(defaultChannelId || '');
      const [channels, setChannels] = useState([]);
      const [loading, setLoading] = useState(false);
      const [gifOpen, setGifOpen] = useState(false);
      const [dragOver, setDragOver] = useState(false);
      const fileRef = useRef(null);

      useEffect(() => {
        if (!defaultChannelId) return;
        api.getMyFeedChannels().then(setChannels).catch(() => { });
      }, [defaultChannelId]);

      const addFiles = (list) => {
        const arr = Array.from(list).slice(0, 4 - files.length);
        setFiles(prev => [...prev, ...arr].slice(0, 4));
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer.types.includes('Files')) setDragOver(true);
      };
      const handleDragLeave = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.currentTarget === e.target) setDragOver(false);
      };
      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragOver(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length) {
          const media = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/') || f.type.startsWith('video/') || f.type.startsWith('audio/'));
          if (media.length === 0) { toast.error('Only image, video, or audio files are supported.'); return; }
          addFiles(media);
          toast.show(`Added ${media.length} file${media.length > 1 ? 's' : ''}.`);
        }
      };

      const submit = async () => {
        if (!text.trim() && files.length === 0 && !reshare && !pollOpts) { toast.error('Write something first.'); return; }
        setLoading(true);
        try {
          const fd = new FormData();
          fd.append('text', text);
          files.forEach(f => fd.append('file', f));
          if (channelId) fd.append('channel_id', channelId);
          if (reshare) fd.append('reshare_id', reshare.id);
          if (pollOpts) pollOpts.filter(o => o.trim()).forEach(o => fd.append('poll_option', o));
          const res = await api.createPost(fd);
          toast.show('Posted.');
          onCreated && onCreated(res.post_id);
          onClose();
        } catch (e) { toast.error(e.message); setLoading(false); }
      };

      return (
        <Modal title={reshare ? 'Reshare post' : 'Create post'} onClose={onClose} wide>
          <div
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
            onDrop={handleDrop}
          >
          <div style={{ display: 'flex', gap: 12 }}>

    const Feed = ({ onProfileClick }) => {
      const ui = useUI();
      const [posts, setPosts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [offset, setOffset] = useState(0);
      const [hasMore, setHasMore] = useState(true);
      const [sort, setSort] = useState('newest');
      const [mediaType, setMediaType] = useState('all');
      const [following, setFollowing] = useState(false);
      const [aggregate, setAggregate] = useState(true);
      const sentinelRef = useRef(null);
      const loadingRef = useRef(false);
      const reqIdRef = useRef(0);
      // Refs mirror state so fetchFeed can stay stable (no posts/offset deps)
      // — keeps the IntersectionObserver from re-creating on every page load.
      const postsRef = useRef([]);
      const offsetRef = useRef(0);
      useEffect(() => { postsRef.current = posts; }, [posts]);
      useEffect(() => { offsetRef.current = offset; }, [offset]);

      const fetchFeed = useCallback(async (reset) => {
        // Single in-flight guard covering every fetch entry point (observer,
        // initial mount, filter changes, compose-onCreated). loadingRef is set
        // synchronously so the IntersectionObserver's initial intersection entry
        // never double-fires fetchFeed. A reset always wins (it supersedes any
        // in-flight non-reset fetch via the request-id check below).
        if (loadingRef.current && !reset) return;
        const reqId = ++reqIdRef.current;
        loadingRef.current = true;
        setLoading(true);
        try {
          const params = {
            limit: 20, sort, media_type: mediaType,
            following: following ? 'true' : undefined, aggregate: aggregate ? 'true' : undefined,
          };
          if (reset) {
            params.offset = 0;
          } else if (sort === 'popular') {
            // Popular re-sorts by votes — cursor isn't meaningful, keep offset.
            params.offset = offsetRef.current;
          } else {
            // Cursor: "posts older than the last one I have". Stable under
            // new arrivals above the cursor (no offset-shift shuffle).
            const last = postsRef.current[postsRef.current.length - 1];
            if (last && last.timestamp_iso) {
              params.before = last.timestamp_iso;
              params.before_id = last.id;
            } else {
              // Fallback when the cursor can't be built (empty list, or the
              // last post has no created_at): advance by offset so the backend
              // returns the NEXT page instead of re-serving page 1.
              params.offset = offsetRef.current;
            }
          }
          const res = await api.getFeed(params);
          if (reqId !== reqIdRef.current) return;   // a newer fetch superseded this one
          const np = res.posts || [];
          setPosts(prev => {
            if (reset) return np;
            // De-duplicate by id in case the backend re-serves a post we
            // already have (prevents the list growing without bound).
            const seen = new Set(prev.map(p => p.id));
            return [...prev, ...np.filter(p => !seen.has(p.id))];
          });
          // Track count loaded locally (backend's next_offset is meaningless in
          // cursor mode: request offset is always 0 there).
          setOffset(prev => reset ? np.length : prev + np.length);
          // Self-sufficient "more available" signal: a full page means there
          // may be more; a short page means we've reached the end.
          setHasMore(np.length >= 20);
        } catch (e) { if (reqId === reqIdRef.current) console.error(e); }
        if (reqId === reqIdRef.current) {
          setLoading(false);
          loadingRef.current = false;
        }
      }, [sort, mediaType, following, aggregate]);

      useEffect(() => { fetchFeed(true); }, [sort, mediaType, following, aggregate]);

      // Infinite scroll: when the sentinel enters the viewport, load the next page.
      // NOTE: `loading` is intentionally NOT a dependency. fetchFeed toggles it
      // twice per fetch, which would tear down & re-create this observer on every
      // page load — and a freshly-created observer dispatches an initial
      // intersection entry that immediately re-fires fetchFeed, looping on the
      // same page. loadingRef guards concurrency without re-creating the observer.
      useEffect(() => {
        const el = sentinelRef.current;
        if (!el) return;
        const io = new IntersectionObserver((entries) => {
          for (const e of entries) {
            if (e.isIntersecting && hasMore && !loadingRef.current) {
              fetchFeed(false);
            }
          }
        }, { rootMargin: '600px' });
        io.observe(el);
        return () => io.disconnect();
      }, [hasMore, fetchFeed]);

      const onUpd = useCallback((p) => setPosts(prev => prev.map(x => x.id === p.id ? p : x)), []);
      const onDel = useCallback((id) => setPosts(prev => prev.filter(x => x.id !== id)), []);

      return (
        <div className="feed-container metro-stagger">
          <InlineCompose onOpen={() => ui.openCompose({ onCreated: () => fetchFeed(true) })} />

          <div className="card" style={{ padding: 10, display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
            <select className="form-input" style={{ width: 'auto' }} value={sort} onChange={e => setSort(e.target.value)}>
              <option value="newest">Newest</option><option value="oldest">Oldest</option><option value="popular">Popular</option>
            </select>
            <select className="form-input" style={{ width: 'auto' }} value={mediaType} onChange={e => setMediaType(e.target.value)}>
              <option value="all">All posts</option><option value="text">Text</option><option value="photos">Photos</option><option value="videos">Videos</option><option value="audio">Audio</option>
            </select>
            <button className={`btn btn-sm ${following ? '' : 'btn-outline'}`} style={{ marginLeft: 'auto' }} onClick={() => setFollowing(f => !f)}>Following</button>
            <button className={`btn btn-sm ${aggregate ? '' : 'btn-outline'}`} onClick={() => setAggregate(a => !a)}>All circles</button>
          </div>

          <div className="feed-stream metro-stagger">
            {posts.map(p => <Post key={p.id} post={p} onProfileClick={onProfileClick} onUpdate={onUpd} onDeleted={onDel} />)}
            {loading && <Spinner />}
            {!loading && posts.length === 0 && <div className="card empty-state">Nothing here yet. Be the first to post.</div>}
          </div>
          <div ref={sentinelRef} style={{ height: 1 }} />
          {loading && hasMore && posts.length > 0 && <Spinner />}
        </div>
      );
    };
